# Publishes site/ (the changelog and thrust damage explorer) to GitHub Pages when it changes on master.
# site/data.json and site/changelog.html are generated locally by scripts/site-data.py (it needs the game's data),
# then committed; this only uploads the folder. Repository settings: Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [master]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
